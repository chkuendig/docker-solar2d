name: Test Actions

on:
  push:
    branches: [main]
    paths:
      - ".github/actions/**"
      - ".github/workflows/test-actions.yml"
      - "walk.sh"
      - "capture.sh"
  pull_request:
    paths:
      - ".github/actions/**"
      - ".github/workflows/test-actions.yml"
      - "walk.sh"
      - "capture.sh"
  workflow_dispatch:

jobs:
  html5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Create sample project
        run: |
          mkdir -p sample
          echo "settings = {}" > sample/build.settings
          cat > sample/config.lua <<'EOF'
          application =
          {
              content = { width = 320, height = 480, scale = "letterbox" },
          }
          EOF
          cat > sample/main.lua <<'EOF'
          display.newText("hello", display.contentCenterX, display.contentCenterY)
          EOF

      - uses: ./.github/actions/build-html5
        with:
          project: sample
          output: out/html5
          app-name: Sample

      - name: Check output
        run: |
          test -f out/html5/Sample.html5/index.html
          # The actions run the container as the runner's uid: outputs must
          # already belong to it — a root-owned file here would send every
          # consumer back to "sudo chown" after container steps.
          [ "$(stat -c %u "out/html5/Sample.html5/index.html")" = "$(id -u)" ]

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Create sample project
        run: |
          mkdir -p sample
          # CoronaBuilder's Android packager stops before it starts without a
          # build.settings, even an empty one.
          echo "settings = {}" > sample/build.settings
          cat > sample/config.lua <<'EOF'
          application =
          {
              content = { width = 320, height = 480, scale = "letterbox" },
          }
          EOF
          cat > sample/main.lua <<'EOF'
          display.newText("hello", display.contentCenterX, display.contentCenterY)
          EOF

      - uses: ./.github/actions/build-android
        with:
          project: sample
          output: out/android
          app-name: Sample
          package: com.example.sample
          version-code: ${{ github.run_number }}

      - name: Check output
        run: |
          test -f out/android/Sample.apk
          test -f out/android/Sample.aab

  walk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Create sample project and steps
        run: |
          mkdir -p sample
          echo "settings = {}" > sample/build.settings
          cat > sample/config.lua <<'EOF'
          application =
          {
              content = { width = 320, height = 480, scale = "letterbox" },
          }
          EOF
          # Red at boot, blue after a tap, green after Enter — each step
          # must leave a visibly different frame, and each prints a marker
          # the walk waits on. (Solar2D names the Return key "enter".)
          cat > sample/main.lua <<'EOF'
          local bg = display.newRect(display.contentCenterX, display.contentCenterY, 600, 900)
          bg:setFillColor(1, 0, 0)
          local taps = 0
          Runtime:addEventListener("touch", function(e)
              if e.phase == "ended" then
                  taps = taps + 1
                  bg:setFillColor(0, 0, 1)
                  print("[APP] tap " .. taps .. " at " .. math.floor(e.x) .. "," .. math.floor(e.y))
              end
              return false
          end)
          Runtime:addEventListener("key", function(e)
              if e.phase == "down" and e.keyName == "enter" then
                  bg:setFillColor(0, 1, 0)
                  print("[APP] return pressed")
              end
              return false
          end)
          EOF
          cat > sample/walk.steps <<'EOF'
          fail [APP] never printed
          wait 2000
          snap red
          tap 160 240
          expect [APP] tap 1 at 160,240
          snap blue
          key return
          expect [APP] return pressed
          snap green
          EOF

      # Release 3734 carries the input FIFO, frame tap and offscreen sizing
      # the walk needs; the action brings its own walk.sh.
      - uses: ./.github/actions/walk
        with:
          project: sample
          steps: sample/walk.steps
          output: out/walk
          screen: 320x480
          video: "true"
          image: ghcr.io/chkuendig/solar2d:3734

      - name: Check output
        run: |
          set -e
          for f in red blue green; do test -f "out/walk/$f.png"; done
          test -s out/walk/walk.mp4
          # Three different frames, not three copies of the first one.
          [ "$(md5sum out/walk/*.png | cut -d' ' -f1 | sort -u | wc -l)" = "3" ]
          # Each snapshot is the colour its step promised (centre pixel). The
          # runner has no ffmpeg; the image does.
          px() { docker run --rm -v "$PWD/out/walk:/w:ro" --entrypoint ffmpeg ghcr.io/chkuendig/solar2d:3734 -v error -i "/w/$1.png" -vf crop=1:1:160:240 -f rawvideo -pix_fmt rgb24 - | od -An -tu1 | tr -s ' ' | sed 's/^ //'; }
          [ "$(px red)"   = "255 0 0" ]
          [ "$(px blue)"  = "0 0 255" ]
          [ "$(px green)" = "0 255 0" ]
          # Outputs belong to the runner's uid, never root.
          [ "$(stat -c %u out/walk/red.png)" = "$(id -u)" ]
