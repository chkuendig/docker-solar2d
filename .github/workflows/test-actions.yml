name: Test Actions

on:
  push:
    branches: [main]
    paths:
      - ".github/actions/**"
      - ".github/workflows/test-actions.yml"
      - "walk.sh"
      - "capture.sh"
  pull_request:
    paths:
      - ".github/actions/**"
      - ".github/workflows/test-actions.yml"
      - "walk.sh"
      - "capture.sh"
  workflow_dispatch:

jobs:
  transport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: bash .github/actions/lib/test-run-build.sh
      - run: python3 .github/actions/walk/test_walk_video.py

  html5:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        transport: [bind, stream]
    steps:
      - uses: actions/checkout@v6

      - name: Create sample project
        run: |
          mkdir -p sample
          echo "settings = {}" > sample/build.settings
          cat > sample/config.lua <<'EOF'
          application =
          {
              content = { width = 320, height = 480, scale = "letterbox" },
          }
          EOF
          cat > sample/main.lua <<'EOF'
          display.newText("hello", display.contentCenterX, display.contentCenterY)
          EOF

      - uses: ./.github/actions/build-html5
        with:
          project: sample
          output: out/html5
          app-name: Sample
          transport: ${{ matrix.transport }}

      - name: Check output
        run: |
          test -f out/html5/Sample.html5/index.html
          # The actions run the container as the runner's uid: outputs must
          # already belong to it — a root-owned file here would send every
          # consumer back to "sudo chown" after container steps.
          [ "$(stat -c %u "out/html5/Sample.html5/index.html")" = "$(id -u)" ]

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Create sample project
        run: |
          mkdir -p sample
          # CoronaBuilder's Android packager stops before it starts without a
          # build.settings, even an empty one.
          echo "settings = {}" > sample/build.settings
          cat > sample/config.lua <<'EOF'
          application =
          {
              content = { width = 320, height = 480, scale = "letterbox" },
          }
          EOF
          cat > sample/main.lua <<'EOF'
          display.newText("hello", display.contentCenterX, display.contentCenterY)
          EOF

      - uses: ./.github/actions/build-android
        with:
          project: sample
          output: out/android
          app-name: Sample
          package: com.example.sample
          version-code: ${{ github.run_number }}
          transport: stream
          gradle-cache: .gradle-cache

      - name: Check output
        run: |
          test -f out/android/Sample.apk
          test -f out/android/Sample.aab

  walk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Create sample project and steps
        run: |
          mkdir -p sample
          echo "settings = {}" > sample/build.settings
          cat > sample/config.lua <<'EOF'
          application =
          {
              content = { width = 320, height = 480, scale = "letterbox" },
          }
          EOF
          # Red at boot, blue after a tap, green after Enter — each step
          # must leave a visibly different frame, and each prints a marker
          # the walk waits on. (Solar2D names the Return key "enter".)
          cat > sample/main.lua <<'EOF'
          local bg = display.newRect(display.contentCenterX, display.contentCenterY, 600, 900)
          bg:setFillColor(1, 0, 0)
          -- A fixed marker catches drifting rows in the video stream, which
          -- uniform colour frames cannot reveal.
          local marker = display.newRect(40, 40, 40, 40)
          marker:setFillColor(1, 1, 1)
          local taps = 0
          Runtime:addEventListener("touch", function(e)
              if e.phase == "ended" then
                  taps = taps + 1
                  bg:setFillColor(0, 0, 1)
                  print("[APP] tap " .. taps .. " at " .. math.floor(e.x) .. "," .. math.floor(e.y))
              end
              return false
          end)
          Runtime:addEventListener("key", function(e)
              if e.phase == "down" and e.keyName == "enter" then
                  bg:setFillColor(0, 1, 0)
                  print("[APP] return pressed")
              end
              return false
          end)
          EOF
          cat > sample/walk.steps <<'EOF'
          fail [APP] never printed
          wait 2000
          snap red
          tap 160 240
          expect [APP] tap 1 at 160,240
          snap blue
          key return
          expect [APP] return pressed
          snap green
          EOF

      # Release 3734 carries the input FIFO, frame tap and offscreen sizing
      # the walk needs; the action brings its own walk.sh.
      - uses: ./.github/actions/walk
        with:
          project: sample
          steps: sample/walk.steps
          output: out/walk
          screen: 320x480
          video: "true"
          image: ghcr.io/chkuendig/solar2d:3734

      - name: Check output
        run: |
          set -e
          for f in red blue green; do test -f "out/walk/$f.png"; done
          test -s out/walk/walk.mp4
          # Three different frames, not three copies of the first one.
          [ "$(md5sum out/walk/*.png | cut -d' ' -f1 | sort -u | wc -l)" = "3" ]
          # Each snapshot is the colour its step promised (centre pixel). The
          # runner has no ffmpeg; the image does.
          px() { docker run --rm -v "$PWD/out/walk:/w:ro" --entrypoint ffmpeg ghcr.io/chkuendig/solar2d:3734 -v error -i "/w/$1.png" -vf crop=1:1:160:240 -f rawvideo -pix_fmt rgb24 - | od -An -tu1 | tr -s ' ' | sed 's/^ //'; }
          [ "$(px red)"   = "255 0 0" ]
          [ "$(px blue)"  = "0 0 255" ]
          [ "$(px green)" = "0 255 0" ]
          # Outputs belong to the runner's uid, never root.
          [ "$(stat -c %u out/walk/red.png)" = "$(id -u)" ]

          # The marker stays white in every decoded frame; ignoring the
          # per-frame protocol header makes it drift across the image.
          docker run --rm -v "$PWD/out/walk:/w:ro" --entrypoint ffmpeg ghcr.io/chkuendig/solar2d:3734 -v error -ss 1 -i /w/walk.mp4 -vf 'format=rgb24,crop=1:1:40:40' -f rawvideo -pix_fmt rgb24 - > /tmp/walk-marker.rgb
          node <<'JS'
          const fs = require('node:fs');
          const data = fs.readFileSync('/tmp/walk-marker.rgb');
          if (data.length < 30 * 3 || data.length % 3) throw new Error('too few complete marker samples');
          if (data.some(channel => channel < 240)) throw new Error('video marker drifted or was corrupted');
          JS
          # Every named state must reach the video in order, including the
          # final state that used to race simulator shutdown.
          docker run --rm -v "$PWD/out/walk:/w:ro" --entrypoint ffmpeg ghcr.io/chkuendig/solar2d:3734 -v error -i /w/walk.mp4 -vf 'format=rgb24,crop=1:1:160:240' -f rawvideo -pix_fmt rgb24 - > /tmp/walk-centre.rgb
          node <<'JS'
          const fs = require('node:fs');
          const data = fs.readFileSync('/tmp/walk-centre.rgb');
          if (data.length % 3) throw new Error('incomplete centre samples');
          const states = [];
          for (let i = 0; i < data.length; i += 3) {
            const [r, g, b] = data.subarray(i, i + 3);
            const state = r > 230 && g < 20 && b < 20 ? 'red'
              : b > 230 && r < 20 && g < 20 ? 'blue'
              : g > 230 && r < 20 && b < 20 ? 'green' : null;
            if (state && states.at(-1) !== state) states.push(state);
          }
          if (states.join(',') !== 'red,blue,green') throw new Error('video omitted or reordered a named state: ' + states);
          const last = [...data.subarray(-3)];
          if (!(last[0] < 20 && last[1] > 230 && last[2] < 20)) throw new Error('final green state missing from video');
          JS
