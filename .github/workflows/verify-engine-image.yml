name: Verify Engine Image

on:
  push:
    branches: [ci/verify-engine-image]
    paths:
      - ".github/workflows/verify-engine-image.yml"
  workflow_dispatch:
    inputs:
      image:
        description: "Solar2D image to verify"
        required: false
        default: "ghcr.io/chkuendig/solar2d:latest"
        type: string

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      IMAGE: ${{ inputs.image || 'ghcr.io/chkuendig/solar2d:latest' }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: chkuendig/corona
          ref: a293abc9be4d5f2d146a8d412da4397b5fcb2668
          path: engine
          sparse-checkout: platform/linux/test

      - name: Pull published image and verify tap support
        run: |
          docker pull "$IMAGE"
          docker image inspect "$IMAGE" --format '{{json .RepoDigests}} {{json .Config.Labels}}'
          docker run --rm --entrypoint sh "$IMAGE" -ec '
            grep -a -q SOLAR2D_VIDEO_PIPE /usr/local/bin/Solar2DSimulator
            grep -a -q SOLAR2D_INPUT_PIPE /usr/local/bin/Solar2DSimulator
            echo "Engine contains video and input tap support"
          '

      - name: Verify native input
        run: bash engine/platform/linux/test/native-input/run.sh "$IMAGE"

      - name: Verify config pixel size
        run: bash engine/platform/linux/test/config-pixel-size/run.sh "$IMAGE"

      - name: Verify the video FIFO reader tools, and no MCP server
        run: |
          docker run --rm --entrypoint sh "$IMAGE" -ec '
            python3 -c "import struct, sys"
            ffmpeg -hide_banner -version >/dev/null
            if ls /usr/local/lib/python3*/dist-packages/server.py >/dev/null 2>&1 ||
               [ -e /root/.config/solar2d-mcp ]; then
              echo "MCP server layer still present" >&2; exit 1
            fi
            echo "python3 and ffmpeg present; no MCP server layer"
          '
